name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make lint
        run: make lint

      - name: make build
        run: make build

      # testdata/ is excluded from ./... by Go tooling convention, so build
      # each tool's demo explicitly too — it's real, runnable example code,
      # not fixtures. Add a line here for each new tool's demo package.
      - name: build examples
        run: go build ./singlecaller/testdata/demo/...

      - name: make test
        run: make test

      # Advisory only: see singlecaller/README.md and BLOG.html for why
      # this never fails the build. "all" picks up every future tool
      # automatically — no need to extend this step per tool.
      - name: make selfcheck
        run: make selfcheck
        continue-on-error: true
